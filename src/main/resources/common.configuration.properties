# Common test properties/configuration
# Values from this file have less priority over ones from test properties files
# Uncomment to change from default value
.include=parts/tests,parts/data,parts/debug,parts/fractions,parts/images,parts/log,parts/project,parts/scenarios,parts/stacktrace,parts/ui,parts/webdriver

# Common test properties/configuration
# Values from this file have less priority over ones from test properties files
# Uncomment to change from default value
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Log types to read from Browser
# _logs.to.read=browser,client,driver,performance,profiler,server
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Color of markings on Screenshots (Red,Green,Blue,Alpha)
# _forced.platform=
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Color of markings on Screenshots (Red,Green,Blue,Alpha)
# _action.marker.colour=255,128,0,128
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Add Appium Debug output to log
# _adebug=false
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Allow each Test Data Storage modification to produce snapshot of current contents
# _data.snapshots.allowed=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Either to produce exceptional state at failed Assertion or not
# _assertions.produce.exception=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Amount of Test Cycles to perform
## .tests=99
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Produce additional output into log to simplify debugging/test analysis
## .debug=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# How many times to retry sufficing a scenario
# _default.scenario.fitting.retries=9
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Weight coefficient of omitted scenarios
# _default.weight=0.0
# ----------------------------------------------------------------------------------------------------------------------------------------------
# How many times to retry exceptional state (while attempting UI interactions)
# _exception.retries=3
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Do not stop execution in cse of failed scenario selection
# _ignore.failed.scenario.selection=false
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Comma separated list of Classes to be not included in Short Stacktrace
## _ignored.in.stack.trace=BotRunner,ClassLoader,Ctrl,Ctrl$Selector,Cycler,Cycles,Exec,Leaf,Logger,LoggerCore,Node,Root,ScenarioLoader
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Indicates whether to display the line number in the shortened stack trace
## _line.number.in.short.stack.trace=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Replace repeated stack traces with references
## _stack.trace.references=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Test nodes Weights propagation
## _include.downstream=true
## _include.upstream=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# ignored.in.stack.trace list is ignored
# _full.stack.trace=false
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Amount of time between checking the state of manual pause
# _pause.length=5000
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Store test data between test runs
## _persist=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Whether to display a notice in case of scenario being not executable
## _scenario.not.executable.notice=false
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Whether to display a notice in case of not fitting scenario
## _scenario.does.not.fit.notice=false
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Screen index to spawn UI interface on
# _screen.to.spawn.dashboard=0
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Produce screenshot for each click (considerable gain in CPU time consumed by BOT)
## _screenshots.of.clicks=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Produce screenshot for each long (procedural) click
## _screenshots.of.long.clicks=true
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Produce screenshot for each swipe
## _screenshots.of.swipes=true
# _swipe.line.marker.colour=0,0,0,128
# _swipe.start.marker.colour=0,255,0,128
# _swipe.stop.marker.colour=255,0,0,128
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Diameter of long (procedural) clicks marker
# _screenshots.of.clicks.marker.diameter=50
# ----------------------------------------------------------------------------------------------------------------------------------------------
# How short a sleep should be to not add log message
# _silent.sleeping.threshold=10
# ----------------------------------------------------------------------------------------------------------------------------------------------
# At event of which severity to stop test execution
## _stop.at.severity=0
# ----------------------------------------------------------------------------------------------------------------------------------------------
# _notify.about.scenario.packages=false
# ----------------------------------------------------------------------------------------------------------------------------------------------
# _recreate.driver.after.exception=true
# ==============================================================================================================================================
# Project-specific values
# Root package of scenarios tree
## _root=bot.scenario
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Path to apk file with application to test
## _app=
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Value for application restart
## _bundleId=
# ----------------------------------------------------------------------------------------------------------------------------------------------
# Dimensions of generated vector graphics result representation
## _svg.width=1920
## _svg.height=1080
.data.delimiter.l0=Delimiter used between top-level entries in framework-serialized values.
.data.delimiter.l1=Delimiter used between level-one entries in framework-serialized values.
.data.delimiter.l2=Delimiter used between level-two entries in framework-serialized values.
.data.persist=Preserves test data between test runs.
.data.snapshots.allowed=Creates a snapshot of test data storage after each modification. Useful for investigating unexpected data changes, at the cost of additional output and I/O.
.data.snapshots.full=Includes full test data contents in snapshots instead of only the changed data.
.grid.action.marker.colour=RGBA colour used to draw action markers on screenshots.
.grid.allowed.margin.severity.reduction=Maximum severity reduction allowed for an out-of-range result that is within the configured margin.
.grid.allowed.other.severity.reduction=Maximum severity reduction allowed for other tolerated validation differences.
.grid.colour.similarity.threshold=Threshold used when comparing colours for similarity. A value closer to one requires a closer match.
.grid.default.colour.ranged.margin=Default tolerance for ranged colour comparisons. Accepts the range-margin format supported by the framework.
.grid.default.horisontal=Default horizontal grid dimension or ratio used when a grid does not specify one.
.grid.default.hsv.margin=Default tolerance for HSV colour comparisons, expressed as a fraction.
.grid.default.polychromy.margin=Default tolerance for polychromy comparisons, expressed as a fraction.
.grid.default.resolution=Default grid resolution used when no resolution is specified.
.grid.default.scale=Default scale applied to a grid when no scale is specified.
.grid.default.vertical=Default vertical grid dimension or ratio used when a grid does not specify one.
.grid.empty.grid.validation.allowed=Allows colour-grid validation to proceed when the grid contains no cells.
.grid.empty.result.severity=Severity assigned when a validation produces an empty result.
.grid.log.line.max.length=Maximum number of characters in a grid-related log line.
.grid.null.result.severity=Severity assigned when a validation produces a null result.
.grid.ranger.log.absent.range=Logs when a configured range is absent from the validation result.
.grid.ranger.log.boundaries=Logs range boundaries while reporting range-validation results.
.grid.ranger.log.non.failing.out.of.bounds=Logs values outside a range even when they do not fail validation.
.grid.ranger.log.order.change=Logs when the order of values or ranges changes.
.grid.ranger.log.overstretch=Logs when a value stretches beyond the configured range.
.grid.ranger.log.scale.check=Logs range scale checks.
.grid.ranger.log.scale.debug=Includes detailed diagnostic information for range scale checks.
.grid.ranger.log.sort.check=Logs checks that verify values or ranges are sorted.
.grid.ranger.log.wide.range=Logs when a range is considered unusually wide.
.grid.ranger.log.width=Preferred width in characters for aligned range-validation log output.
.grid.shrink.expectations=Allows image-based validation expectations to be reduced to fit the observed result.
.grid.stamps.compress=Compresses generated grid stamps before storing them.
.grid.stamps.display=Displays generated grid stamps in output.
.grid.stamps.process=Processes generated grid stamps during validation and reporting.
.grid.update.colour.expectations=Updates stored colour expectations from the current validation result.
.grid.update.hsv.expectations=Updates stored HSV expectations from the current validation result.
.grid.update.passed.expectations=Updates stored expectations for validations that passed.
.grid.update.polychromy.expectations=Updates stored polychromy expectations from the current validation result.
.grid.validation.default.border=Default colour-comparison border tolerance used during grid validation.
.grid.validation.fences=Default fence tolerance used when validating grid values.
.grid.validation.hsb.threshold=Threshold used when validating hue, saturation, and brightness differences.
.grid.validation.scale.epsilon=Floating-point tolerance used when comparing grid scales during validation.
.grid.verify.colours=Enables colour verification during grid validation.
.grid.wide.range.threshold=Fractional threshold used to classify or report a range as wide.
.logs.adebug=Writes detailed Appium diagnostic output to the log. Enable it when investigating Appium or device communication issues; it can make logs substantially larger.
.logs.debug=Enables additional diagnostic output to help analyze test execution. Enable temporarily when troubleshooting; it increases log volume.
.logs.full.stacktrace=Includes the full stack trace instead of shortening it for logs.
.logs.ignored.in.stacktrace=Comma-separated class names omitted from shortened stack traces.
.logs.line.number.in.short.stacktrace=Shows source line numbers in shortened stack traces.
.logs.lines.similarity.check=Enables detection and grouping of similar log lines.
.logs.lines.similarity.delta=Maximum time difference, in milliseconds, considered when matching log lines as similar.
.logs.lines.similarity.depth=Number of consecutive log lines considered together when checking for similarity.
.logs.lines.similarity.exceptions.permanent=Delimiters-separated patterns that permanently exclude matching log lines from similarity grouping.
.logs.lines.similarity.exceptions.temporary=Delimiters-separated patterns that temporarily exclude matching log lines from similarity grouping.
.logs.lines.similarity.limit=Maximum number of characters considered when comparing log lines for similarity.
.logs.rate.1=Upper threshold for assigning the lowest configured log-rate colour.
.logs.rate.2=Upper threshold for assigning the next configured log-rate colour.
.logs.rate.3=Upper threshold for assigning the next configured log-rate colour.
.logs.rate.4=Upper threshold for assigning the highest configured log-rate colour.
.logs.silent.sleeping.threshold=Sleep durations shorter than this threshold, in milliseconds, do not produce a log message.
.logs.stack.trace.references=Replaces repeated stack traces in logs with references to their earlier occurrence.
.logs.table.width=Preferred width in characters for aligned log tables.
.logs.time.stamp.format=Pattern used to format fractional seconds in log timestamps.
.logs.to.read=Comma-separated log types to collect from the browser, client, driver, performance, profiler, and server.
.logs.trace=Adds method names and variable values to diagnostic output; enable only when the additional trace detail is needed.
.math.fractions.accuracy=Maximum decimal precision used when representing fractional values.
.math.fractions.output=Displays fractional values in fraction form where supported instead of decimal form.
.mobi.native.x.resolution=Native screen width in pixels used for coordinate-based mobile interactions.
.mobi.native.y.resolution=Native screen height in pixels used for coordinate-based mobile interactions.
.mobi.ud.id=Device identifier (UDID) used to select a specific mobile device.
.progression.ffmpeg=Executable name or path to FFmpeg, used when generating progression videos.
.progression.max.frame.pixels=Maximum pixel count permitted for a single progression frame. Frames exceeding the configured limit are skipped.
.progression.max.frames=Maximum number of progression frames retained and included in generated animations.
.progression.max.total.pixels=Maximum total pixel count processed for a single progression animation.
.progression.scenario=Generates frames and animations showing scenario coverage progression.
.progression.scenario.mp4=Generates an MP4 video of scenario coverage progression. Requires FFmpeg.
.progression.tree=Generates frames and animations showing test-tree progression.
.progression.tree.mp4=Generates an MP4 video of test-tree progression. Requires FFmpeg.
.progression.tree.sonification=Adds an experimental, deterministic musical sonification to tree progression MP4s. Values: 'none' (default, no audio); 'copilot' - new leaf executions create notes, leaf paths determine pitch, progress to target affects dynamics; 'claude' - changes between consecutive frame images create notes, horizontal position determines pitch, amount of change determines loudness, and progress colour determines timbre; 'gemini' - ambient structural cascade tracking the tree layout over time.
.screen.to.spawn.dashboard=Screen index on which to open the dashboard.
.screenshots.of.binds=Captures screenshots for image regions identified by colour-based bounds.
.screenshots.of.clicks=Captures a screenshot after each click. This can significantly increase execution time and output size.
.screenshots.of.long.clicks=Captures a screenshot after each long (procedural) click.
.screenshots.of.long.clicks.marker.diameter=Diameter in pixels of the marker shown for long (procedural) clicks.
.screenshots.of.pixels=Captures screenshots for individual pixels used in image-based validation.
.screenshots.of.swipes=Captures a screenshot after each swipe.
.swipes.big.reduction=Reduction factor applied to large swipes when deriving swipe coordinates.
.swipes.default.reduction=Default reduction factor applied when deriving swipe coordinates.
.swipes.default.weight=Default weight assigned to swipe interactions in weighted calculations.
.swipes.medium.reduction=Reduction factor applied to medium-sized swipes when deriving swipe coordinates.
.swipes.marker.line.colour=RGBA colour used to draw the swipe path in screenshots.
.swipes.marker.start.colour=RGBA colour used to mark the start of a swipe in screenshots.
.swipes.marker.stop.colour=RGBA colour used to mark the end of a swipe in screenshots.
.test.action.retries=Number of retry attempts allowed for an action when it does not succeed immediately.
.test.all.leafs=Runs all leaf tests when enabled, rather than limiting execution to the currently selected leaf tests. Also available as the ALL_LEAFS execution parameter: set it through an environment variable or Java system property (for example, -DALL_LEAFS=true) for CI, or save .all.leafs in common or test configuration to persist it across sessions.
.test.all.leafs.count=Limits the number of leaf tests selected when running all leaf tests. Values greater than one select that many leaves. Also available as the ALL_LEAFS_COUNT execution parameter: set it through an environment variable or Java system property (for example, -DALL_LEAFS_COUNT=3) for CI, or save .all.leafs.count in common or test configuration to persist it across sessions.
.test.app=Path or name of the application package to launch for mobile testing (for example, an APK file).
.test.assertions.produce.exception=Controls whether a failed assertion produces an exception. Disable only when the test flow is expected to continue after assertion failures.
.test.bundle.id=Application bundle identifier used to launch the app on iOS.
.test.ewait=Maximum time in seconds to wait for an explicit condition, such as an element becoming visible or clickable.
.test.exception.retries=Number of retries after an exceptional state during UI interaction.
.test.execution.time.safeguard=Execution-time safeguard in the framework's duration-threshold format.
.test.fail.by.event.of.severity=Stops test execution when an event reaches this severity level.
.test.headless=Runs browser automation without displaying a browser window when enabled. Also available as the HEADLESS execution parameter: set it through an environment variable or Java system property (for example, -DHEADLESS=true) for CI, or save the value in the GUI parameters file to persist it across sessions.
.test.long.operation.severity=Severity assigned to an operation that exceeds the long-operation threshold.
.test.long.operation.threshold=Duration in milliseconds above which an operation is reported as long.
.test.max.typing.delay=Maximum delay, in milliseconds, used when simulating typing.
.test.pause.length=Interval in milliseconds between checks for a manual pause.
.test.root=Root scenario or test-tree name used by the framework when resolving the project test structure.
.test.scenario.sufficiency.attempts=Number of attempts used when retrying scenario sufficiency checks.
.test.tests=Number of test cycles to execute; leave unset to use the runner's default.
.tree.completion.weight=Controls how strongly scenario selection favours unfinished work. Each branch's completion boost is proportional to the sum of remaining execution deficits across its accessible leaf descendants; configured scenario weights remain in effect.
.tree.default.weight=Weight assigned to scenarios when no explicit weight is configured.
.tree.fits.by.default=Default result used when a scenario fit cannot otherwise be determined.
.tree.forbid.overexecution=When true, leaf scenarios that have reached their target execution count are set to weight 0 and marked non-executable.
.tree.ignore.failed.scenario.selection=Allows execution to continue when selecting scenarios fails. Use with care, because the selected test set may not be the expected one.
.tree.include.downstream=Includes downstream test nodes when propagating or calculating test node weights.
.tree.include.upstream=Includes upstream test nodes when propagating or calculating test node weights.
.tree.notify.about.empty.scenario.packages=Displays a notice when a scenario package contains no executable scenarios.
.tree.traverse.extensions=Resolves inherited scenarios through their superclass chain when determining configured scenario weights. A concrete scenario's explicit weight takes precedence.
.tree.scenario.depth.safeguard=Maximum scenario-tree depth allowed before a safeguard is triggered.
.tree.scenario.does.not.fit.notice=Displays a notice when a scenario does not fit the current execution conditions.
.tree.scenario.history.depth.safeguard=Maximum scenario history depth retained before a safeguard is triggered.
.tree.scenario.not.executable.notice=Displays a notice when a scenario cannot be executed.
.webd.forced.platform=Forces the target platform (for example, Android or iOS) instead of relying on automatic platform detection.
.webd.iwait=Implicit WebDriver wait in milliseconds while locating elements. Long implicit waits can slow down each unsuccessful lookup.
.webd.recreate.driver.after.exception=Recreates the WebDriver instance after an exception, which can help recover from a broken browser session.